<div
  role="alert"
  class="flex flex-col gap-3 rounded-2xl border border-danger-ring bg-danger-surface p-5 sm:flex-row sm:items-center sm:justify-between sm:p-6"
>
  <div class="flex flex-col gap-1">
    <p class="font-medium text-danger">{{ title() }}</p>
    <p class="text-sm text-danger">{{ error().message }}</p>
  </div>
  @if (canRetry()) {
    <button
      type="button"
      class="self-start rounded-xl border border-danger-ring px-4 py-2 text-sm font-medium text-danger hover:bg-danger-hover sm:self-center"
      (click)="retry.emit()"
    >
      Try again
    </button>
  }
</div>
